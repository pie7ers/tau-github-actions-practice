name: api pipeline composite-actions
run-name: Build, Deploy, Test from user @${{ github.actor }} using own composite actions

on:
  workflow_dispatch:
  pull_request:
    branches: [main, test, dev]

jobs:
  build-composite:
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: pie7ers/actions/node/basic-setup@v1

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run API Tests
        run: npm run test:api

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.ACT != 'true' }}
        with: 
          name: simulate build
          path: ./dist
          retention-days: 3
          if-no-files-found: warn

  analyze-composite:
    runs-on: ubuntu-latest
    needs: build-composite
    permissions:
      # allow read info from the current workflow, likewise previous executions, artifacts, and CodeQL to query the execution context
      actions: read
      # allow read files of the repo, access to historical commits, download repository content via API
      contents: read
      # allow analyze and the result be uploaded to Github/security/code scanning
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
    
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
    
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
    
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:typescript"

  #Render is used to deploy the API and handles the Continuous Deployment (CD) process.
  deploy-composite:
    runs-on: ubuntu-latest
    needs: build-composite
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: simulate build
          path: ./dist

      - name: Deploy (simulated)
        run: |
          echo "Deploying build to TEST environment"
          ls -la dist
      
      - name: Check Render API
        uses: pie7ers/actions/wait-for-api@v1
        with:
          url-health: "https://tau-github-actions-practice.onrender.com/health"
    
  #This step normally runs at the end of the build or deployment process.
  #It is commonly used in projects that generate deployable artifacts,
  #such as installers or Docker images, to clean temporary resources.
  cleanup-composite:
    needs: deploy-composite
    runs-on: ubuntu-latest
    environment: test
    
    steps:
      - name: cleanup ${{ github.env }}
        if: always()
        run: echo "cleanup example"

  trigger-test-repo-composite:
    needs: deploy-composite
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: event
        uses: pie7ers/actions/trigger-repo-dispatch@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: ${{ vars.TEST_REPO_OWNER }}
          repository: ${{ vars.TEST_REPO }}
          event-type: trigger-tests
          client-payload: |
            {
              "env": "test",
              "system": "Render",
              "version": "1.0.0",
              "trigger_by": "${{ github.actor }}"
            }