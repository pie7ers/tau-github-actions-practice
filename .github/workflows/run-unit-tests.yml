name: run unit tests of feature branches

on:
  push:
    branches:
      - "feat/*"
  pull_request:
    branches: [main]

jobs:
  run-unit-test:
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
