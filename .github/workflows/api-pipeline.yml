name: api pipeline
run-name: Build, Deploy, Test from user @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches: [main, test, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
    
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run API Tests
        run: npm run test:api

      - uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with: 
          name: simulate build
          path: ./dist
          retention-days: 3

  analyze:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # allow read info from the current workflow, likewise previous executions, artifacts, and CodeQL to query the execution context
      actions: read
      # allow read files of the repo, access to historical commits, download repository content via API
      contents: read
      # allow analyze and the result be uploaded to Github/security/code scanning
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
    
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
    
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
    
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:typescript"

  #Render is used to deploy the API and handles the Continuous Deployment (CD) process.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: simulate build
          path: ./dist

      - name: Deploy (simulated)
        run: |
          echo "Deploying build to TEST environment"
          ls -la dist
      
      - name: Check Render deploy
        run: |
          chmod +x .github/scripts/check-api.sh
          sh .github/scripts/check-api.sh
    
  #This step normally runs at the end of the build or deployment process.
  #It is commonly used in projects that generate deployable artifacts,
  #such as installers or Docker images, to clean temporary resources.
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    environment: test
    
    steps:
      - name: cleanup ${{ github.env }}
        if: always()
        run: echo "cleanup example"

  trigger-test-repo:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    environment: test
    env:
      TEST_FULL_REPO_OWNER: ${{ vars.TEST_FULL_REPO_OWNER }}
    
    steps:
      - name: generate token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY  }}
      
      - name: Trigger repo tests
        run: |
          set -e
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/$TEST_FULL_REPO_OWNER/dispatches \
            -d "{
              \"event_type\": \"trigger-tests\",
              \"client_payload\": {
                \"env\": \"test\",
                \"system\": \"Render\",
                \"version\": \"1.2.3\",
                \"actor\": \"${{ github.actor }}\"
              }
            }"